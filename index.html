<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="build" content="sanjay-study-1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanjay Lal Bhai Residence — Private Cinema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--t1:#F5F5F7;--t2:#86868B;--t3:#6E6E73;--sep:rgba(255,255,255,.1);--blue:#0071E3;--green:#30D158;--orange:#FF9F0A;--red:#FF453A;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;overflow:hidden;color:var(--t1);font-family:var(--font);-webkit-font-smoothing:antialiased;background:#000}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(110% 80% at 62% 48%,#26262a 0%,#101012 55%,#000 100%)}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#stage canvas:active{cursor:grabbing}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);font-size:11.5px;font-weight:500;letter-spacing:-.01em;color:var(--t1);background:rgba(29,29,31,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:4px 10px;border-radius:999px;white-space:nowrap}
.lbl.strong{background:rgba(245,245,247,.96);color:#1d1d1f;font-weight:600}
.lbl.small{font-size:10.5px;padding:3px 8px}
.lbl.alert{background:var(--red);color:#fff}
.lbl.good{background:var(--green);color:#052b12}
/* global nav — apple.com pattern */
.gnav{position:fixed;top:0;left:0;right:0;height:44px;background:rgba(22,22,23,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);z-index:10}
.gin{max-width:1024px;height:100%;margin:0 auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.gin img{height:15px;width:auto;display:block;opacity:.92}
.steps{display:flex;gap:4px}
.steps button,.lnk{font:inherit;font-size:12px;letter-spacing:-.01em;color:rgba(232,232,237,.8);background:none;border:none;padding:6px 10px;cursor:pointer;border-radius:6px;transition:color .2s}
.steps button:hover,.lnk:hover{color:#fff}
.steps button.on{color:#fff;font-weight:600}
/* local nav */
.lnav{position:fixed;top:44px;left:0;right:0;height:52px;background:rgba(0,0,0,.55);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(255,255,255,.08);z-index:9}
.lin{max-width:1024px;height:100%;margin:0 auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between}
.ltitle{font-size:21px;font-weight:600;letter-spacing:.011em}
.ltitle span{color:var(--t2);font-weight:400}
.ltitle .dims{font-style:normal;font-size:12px;font-weight:500;color:var(--t2);margin-left:14px;padding:4px 10px;border-radius:980px;background:rgba(118,118,128,.24);vertical-align:3px}
.opts{display:flex;align-items:center;gap:6px}
.opts button{font:inherit;font-size:12px;letter-spacing:-.01em;color:rgba(245,245,247,.8);background:none;border:none;padding:5px 11px;border-radius:980px;cursor:pointer}
.opts button:hover{color:#fff}
.opts button.on{background:var(--blue);color:#fff}
button:focus-visible{outline:2px solid #2997ff;outline-offset:2px}
/* info card */
#card{position:fixed;left:28px;top:120px;width:360px;max-height:calc(100% - 200px);overflow-y:auto;background:rgba(29,29,31,.72);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-radius:22px;padding:28px 26px 22px}
#card::-webkit-scrollbar{width:0}
.eyebrow{font-size:14px;font-weight:600;letter-spacing:-.01em;background:linear-gradient(90deg,#f5d0a0,#e8a6ff 60%,#9ab8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#card h1{font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-.015em;margin:6px 0 12px}
#card p.cap{font-size:15px;line-height:1.47;color:var(--t2);letter-spacing:-.01em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:22px 16px;margin-top:24px}
.tile .v{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.05;display:flex;align-items:center;gap:8px}
.tile .v small{font-size:15px;font-weight:600;color:var(--t2);letter-spacing:0}
.tile .k{font-size:12.5px;color:var(--t2);margin-top:5px;line-height:1.35}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.d-ok{background:var(--green)}.d-warn{background:var(--orange)}.d-bad{background:var(--red)}
.list{margin-top:22px;border-top:1px solid var(--sep)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;font-size:13.5px;border-bottom:1px solid var(--sep);letter-spacing:-.01em}
.row span{color:var(--t2)}
.row b{font-weight:500;text-align:right}
.pill{display:flex;margin-top:20px;background:rgba(118,118,128,.24);border-radius:980px;padding:3px}
.pill button{flex:1;font:inherit;font-size:13px;font-weight:500;color:var(--t1);background:none;border:none;border-radius:980px;padding:8px 10px;cursor:pointer}
.pill button.on{background:#F5F5F7;color:#1d1d1f}
details{margin-top:16px;font-size:13px;color:var(--t2)}
details summary{cursor:pointer;color:#2997FF;list-style:none}
details summary::after{content:" ›"}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px}
td,th{padding:6px 2px;border-bottom:1px solid var(--sep);text-align:left}
th{color:var(--t3);font-weight:500}
.fine{font-size:12px;color:var(--t3);line-height:1.5;margin-top:16px}
/* bottom controls */
.paddles{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:rgba(29,29,31,.72);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:980px;padding:6px 8px}
.paddles .pb{width:36px;height:36px;border-radius:50%;border:none;background:rgba(210,210,215,.16);color:#f5f5f7;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.paddles .pb:hover{background:rgba(210,210,215,.28)}
.dots{display:flex;gap:8px;padding:0 4px}
.dots button{width:8px;height:8px;border-radius:980px;border:none;background:rgba(245,245,247,.35);cursor:pointer;padding:0;transition:width .3s,background .3s}
.dots button.on{width:28px;background:#f5f5f7}
.views{position:fixed;right:28px;bottom:26px;display:flex;gap:2px;padding:4px;background:rgba(29,29,31,.72);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:980px}
.views button{font:inherit;font-size:12px;font-weight:500;color:var(--t2);background:none;border:none;border-radius:980px;padding:7px 12px;cursor:pointer}
.views button.on{background:rgba(118,118,128,.36);color:var(--t1)}
.views button:hover:not(.on){color:var(--t1)}
@media (max-width:1000px){.steps{display:none}#card{left:12px;right:12px;width:auto;top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-height:44vh}}
.grab{display:none}
@media (max-width:760px){
  .gin{padding:0 14px}.gin img{height:13px}
  .lnav{height:46px}.lin{padding:0 14px;gap:8px}
  .ltitle{font-size:15px;white-space:nowrap}.ltitle span,.ltitle .dims{display:none}
  .opts{gap:2px}.opts button{font-size:11.5px;padding:5px 9px}
  #card{top:auto;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom,0px));max-height:42vh;padding:8px 18px 16px;border-radius:20px}
  .grab{display:block;width:100%;height:22px;border:none;background:none;cursor:pointer;position:relative}
  .grab::before{content:"";position:absolute;left:50%;top:8px;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:rgba(245,245,247,.35)}
  .eyebrow{font-size:12px}
  #card h1{font-size:22px;margin:3px 0 8px}
  #card p.cap{font-size:13.5px}
  .tiles{gap:14px 12px;margin-top:14px}.tile .v{font-size:22px}.tile .v small{font-size:12px}.tile .k{font-size:11.5px}
  .list{margin-top:14px}.row{font-size:12.5px;padding:9px 0}
  .pill{margin-top:14px}.fine{font-size:11px}
  #card.min{max-height:none}
  #card.min .cap,#card.min .tiles,#card.min .list,#card.min details,#card.min .fine{display:none}
  .paddles{bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:4px 6px;gap:10px}
  .paddles .pb{width:32px;height:32px;font-size:18px}
  .views{flex-direction:column;right:8px;top:100px;bottom:auto;border-radius:14px;padding:3px}
  .views button{padding:7px 9px;font-size:11px}
  .lbl{font-size:10px;padding:3px 8px}.lbl.small{font-size:9px;padding:2px 6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
#sheet{position:fixed;left:416px;right:28px;top:120px;bottom:92px;overflow:auto;background:rgba(24,24,26,.96);border-radius:18px;padding:18px 22px 24px;display:none;z-index:4}
#sheet.on{display:block}
.lbl.warn{background:var(--orange);color:#2b1700}
#bassSeg button{font-size:12px;padding:8px 4px}
#sheet::-webkit-scrollbar{width:0}
.shTabs{display:flex;gap:2px;padding:3px;background:rgba(118,118,128,.24);border-radius:980px;width:max-content;margin-bottom:14px}
.shTabs button{font:inherit;font-size:12.5px;font-weight:500;color:var(--t1);background:none;border:none;border-radius:980px;padding:7px 14px;cursor:pointer}
.shTabs button.on{background:#F5F5F7;color:#1d1d1f}
.dwg{width:100%;height:auto;display:block}
.dwgNote{font-size:12px;color:var(--t2);margin-top:10px;line-height:1.5}
.key{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--t2);margin-top:8px}
.key i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
ol.rev{margin:18px 0 0 18px;font-size:13.5px;line-height:1.45;color:var(--t1)}
ol.rev li{margin-bottom:9px}
ol.rev li span{color:var(--t2)}
#card{z-index:5}
#shBody{overflow-x:auto}
@media (max-width:1000px){#sheet{left:10px;right:10px;top:104px;bottom:calc(200px + env(safe-area-inset-bottom,0px));padding:14px 14px 20px}}
@media (max-width:760px){.dwg{min-width:720px}}
</style>
</head>

<script>
(function(){
'use strict';
/* ---------- room data, scaled from the R3 drawings (08-07-2025) ---------- */
const C=343, W=5.864, L=8.0, H=3.733, RIS=.6, PLAT_V=4.15, SW=4.8, SH=2.7, SCRV=.06, EYE=1.0, PITCH=.78;
const R1={v:3.80,y:0,n:5}, R2={v:6.05,y:RIS,n:5,mlp:2};
const ARM_F=.56, BACK_R=.29, AL={u0:-1.1,v0:6.2};        // entry vestibule (rear-left) at +600 level
const rowU=(n,cx)=>Array.from({length:n},(_,i)=>cx+(i-(n-1)/2)*PITCH);
const DBA={w:.67,h:.85,d:.33};                              // MAG Theatron DBA15, W × H × D
let state={cfg:'wf22',step:1,view:'iso',sh:'front'};
const SB=()=>.63;                                           // LED bottom stays at 630 (subs may sit partly behind it; drivers stay clear)
const RR=()=>(state.cfg==='wf24'||state.cfg==='wf44')?.84:1.308;                  // rear-surround centre from side wall

function geom(){ const cx=W/2; R1.us=rowU(R1.n,cx); R2.us=rowU(R2.n,cx);
  return {cx,r1:R1,r2:R2,mlp:{u:cx,v:R2.v,y:R2.y+EYE},ear1:R1.y+EYE,d1:R1.v-SCRV,d2:R2.v-SCRV}; }
function viewAngle(u,v){ const a=Math.atan2((W/2-SW/2)-u,v-SCRV), b=Math.atan2((W/2+SW/2)-u,v-SCRV); return Math.abs(b-a)*180/Math.PI; }

/* speakers as drawn in R3 (B&W 800 D4). Every surround and top is aimed at the MLP (row 2 centre), as in the elevations */
function speakers(){ const g=geom(),sb=SB(),s=[],cx=g.cx,rr=RR();
  s.push({n:'L',u:.30,v:.72,y:1.1,k:'801'},{n:'R',u:W-.30,v:.72,y:1.1,k:'801'});
  s.push({n:'C upper',u:cx,v:.25,y:sb+SH+.19,k:'htm',aim:1,flip:1},{n:'C lower',u:cx,v:.25,y:sb-.19,k:'htm',aim:1});   // mirrored pair: upper inverted, both tweeters against the LED edge
  s.push({n:'Lw',u:.24,v:2.85,y:1.25,k:'805',aim:1},{n:'Rw',u:W-.24,v:2.85,y:1.25,k:'805',aim:1});
  s.push({n:'Ls',u:.24,v:5.3,y:1.85,k:'805',aim:1},{n:'Rs',u:W-.24,v:5.3,y:1.85,k:'805',aim:1});
  s.push({n:'Lrs',u:rr,v:L-.24,y:RIS+1.17,k:'805',aim:1},{n:'Rrs',u:W-rr,v:L-.24,y:RIS+1.17,k:'805',aim:1});
  [['tf',1.95],['tm',4.3],['tr',6.6]].forEach(([k,v])=>s.push({n:'L'+k,u:cx-1.565,v,y:H+.2,k:'805',top:1,aim:1},{n:'R'+k,u:cx+1.565,v,y:H+.2,k:'805',top:1,aim:1}));
  s.forEach(p=>{ p.az=Math.atan2(Math.abs(p.u-cx),g.mlp.v-p.v)*180/Math.PI; if(p.top) p.el=Math.atan2(p.y-g.mlp.y,Math.hypot(p.u-cx,p.v-g.mlp.v))*180/Math.PI; });
  return s; }
/* Trinnov median-angle check for the wides: line from MLP through the midpoint of L and Ls */
function medianWide(){ const g=geom(),s=speakers(),l=s.find(x=>x.n==='L'),ls=s.find(x=>x.n==='Ls'); const mu=(l.u+ls.u)/2,mv=(l.v+ls.v)/2; return Math.atan2(g.cx-mu,g.mlp.v-mv)*180/Math.PI; }

/* subwoofers */
function subs(){ if(state.cfg==='r3') return [
    {n:'DB1D',u:.30,v:.21,y:.21,w:.42,h:.42,d:.42,front:1},{n:'DB1D',u:W-.30,v:.21,y:.21,w:.42,h:.42,d:.42,front:1},

  const st=bassStats(state.cfg,Gm.seats); Gm.bst=st; Gm.seats.forEach((s,i)=>{ const d=st.dev[i]; label('±'+d.toFixed(1)+' dB',P(s.u,s.y+.32,s.v),d<=3?'good':(d<=6?'warn':'alert'),'bass'); });

function spawn(){
  if(state.cfg!=='r3'){ const mat=new THREE.MeshBasicMaterial({map:sheetTex,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false});
    const sh=new THREE.Mesh(new THREE.PlaneGeometry(W-.08,H-.08),mat);
    const ed=new THREE.LineSegments(new THREE.EdgesGeometry(sh.geometry),new THREE.LineBasicMaterial({color:0xff6b5e,transparent:true,opacity:0})); sh.add(ed);
    G.waves.add(sh); waves.push({type:'sheet',m:sh,ed,v:.35});
    subs().filter(s=>s.front).forEach(s=>{ const m=new THREE.Mesh(sphereGeo,new THREE.MeshBasicMaterial({color:0xff5a46,transparent:true,opacity:.3,depthWrite:false,side:THREE.DoubleSide,clippingPlanes:CLIP})); m.position.copy(P(s.u,s.y,0)); m.scale.setScalar(.01); G.waves.add(m); waves.push({type:'let',m,r:0}); });
  } else {
    subs().forEach(s=>{ const v=s.v,pts=[[s.u,s.y,v],[-s.u,s.y,v],[2*W-s.u,s.y,v],[s.u,-s.y,v],[s.u,2*H-s.y,v],[s.u,s.y,-v],[s.u,s.y,2*L-v]];
      pts.forEach((p,k)=>{ const m=new THREE.Mesh(sphereGeo,new THREE.MeshBasicMaterial({color:k?0xff8a70:0xff4a3a,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide,clippingPlanes:CLIP})); m.position.copy(P(p[0],p[1],p[2])); m.scale.setScalar(.01); G.waves.add(m); waves.push({type:'sph',m,r:0,img:k>0}); }); }); } }
const SPEED=1.45, EVERY=.85;
function tickWaves(dt){ if(!G.waves) return; G.t+=dt; G.spawnT-=dt; if(G.spawnT<=0){ spawn(); G.spawnT=EVERY; }
  for(let i=waves.length-1;i>=0;i--){ const w=waves[i];
    if(w.type==='sheet'){ w.v+=SPEED*dt; const fin=Math.min(1,(w.v-.35)/.5), fout=Math.min(1,Math.max(0,(L-.12-w.v)/.7)); const op=.36*fin*fout; w.m.material.opacity=op; w.ed.material.opacity=op*1.6; w.m.position.copy(P(W/2,H/2,w.v)); if(w.v>L-.12){ G.waves.remove(w.m); w.m.geometry.dispose(); waves.splice(i,1); } }
    else if(w.type==='let'){ w.r+=SPEED*dt; w.m.scale.setScalar(Math.max(.01,w.r)); w.m.material.opacity=.3*Math.max(0,1-w.r/.8); if(w.r>.8){ G.waves.remove(w.m); waves.splice(i,1); } }

  s+=`<line x1="532" y1="40" x2="5332" y2="40" stroke="${DW.led}" stroke-width="40"/>`+txt(900,190,'LED 4,800',DW.led,90,'start');
  s+=rect(cxm-423,60,847,371,DW.spk,'rgba(142,142,147,.15)')+txt(cxm,540,'HTM81 upper + lower',DW.spk,76);
  [.30,W-.30].forEach(u=>s+=pTear(u,.72,490,600));
  [R1,R2].forEach(r=>rowU(5,W/2).forEach(u=>s+=rect(u*1000-370,(r.v-ARM_F)*1000,740,900,DW.line,'rgba(255,255,255,.05)',0,8)));
  const sp=speakers();
  sp.filter(p=>p.top).forEach(p=>s+=pTear(p.u,p.v,240,340,DW.spk,'rgba(142,142,147,.08)'));
  sp.filter(p=>p.k==='805'&&!p.top&&p.n.indexOf('rs')<0).forEach(p=>s+=pTear(p.u,p.v,240,340));
  s+=pTear(RR(),L-.24,240,340)+pTear(W-RR(),L-.24,240,340); if(!(state.cfg==='wf24'||state.cfg==='wf44')) s+=rect(718-122,L*1000-380,244,340,DW.new,'none',1,8)+rect(Wm-718-122,L*1000-380,244,340,DW.new,'none',1,8);
  [[300,210],[Wm-300,210],[300,Lm-210],[Wm-300,Lm-210]].forEach(([x,y])=>s+=rect(x-210,y-210,420,420,DW.old,'none',1,8)+xmark(x-210,y-210,420,420,DW.old));
  [q,3*q].forEach(c=>{ s+=rect(c-425,-330,850,330,DW.new,'rgba(255,159,10,.35)',0,12)+rect(c-335,Lm,670,330,DW.new,'rgba(255,159,10,.35)',0,12); });
  [q,3*q].forEach(c=>s+=rect(c-425,20,850,670,DW.new,'none',1,10)+txt(c,380,'ceiling void · ideal',DW.new,70));
  s+=txt(q,-400,'F1 · DBA15',DW.new,90)+txt(3*q,-400,'F2 · DBA15',DW.new,90)+txt(q,Lm+470,'R1 (R3 below)',DW.new,86)+txt(3*q,Lm+470,'R2 (R4 below)',DW.new,86);
  s+=dimH(0,q,-650,f0(q),1)+dimH(q,3*q,-650,f0(2*q)+' c/c',1)+dimH(3*q,Wm,-650,f0(q),1)+dimV(Wm+700,0,Lm,'≈ 8,000 finished')+dimH(0,Wm,Lm+700,'5,864 finished');
  s+=`<circle cx="${cxm}" cy="${R2.v*1000}" r="70" fill="#FF453A"/>`+txt(cxm,R2.v*1000+250,'MLP',DW.old,80);
  return s+`</svg>`+KEY+`<p class="dwgNote">Plan scaled from the R3 drawings. Surrounds, wides and the six ceiling speakers are drawn aimed at the MLP, as in the R3 elevations; the tops sit in the 517 mm ceiling void. Following Trinnov's L-shaped-room guidance, every sub position is taken from the 5,864 mm main room, not the vestibule. No subs go in the vestibule.</p>`; }

function renderSheet(){ document.querySelectorAll('#shTabs button').forEach(b=>b.classList.toggle('on',b.dataset.sh===state.sh));
  document.getElementById('shBody').innerHTML=state.sh==='front'?frontSVG():state.sh==='rear'?rearSVG():planSVG(); }
document.getElementById('shTabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; state.sh=b.dataset.sh; renderSheet(); });

/* ---------- card ---------- */
const row=(k,v)=>`<div class="row"><span>${k}</span><b>${v}</b></div>`;
const tile=(v,k,c)=>`<div class="tile"><div class="v">${c?`<i class="dot d-${c}"></i>`:''}${v}</div><div class="k">${k}</div></div>`;
const STEPN=['','Room & Entry','Viewing Angles','Speakers','WaveForming','LED Screen','Drawing Changes'];
const CFGN={r3:'R3 layout',wf22:'Revised',wf24:'Revised + phase 2',wf44:'Ideal 4 + 4'};
function cardHTML(){ const st=state.step,g=Gm,rear=L-(R2.v+BACK_R), top=t=>`<div class="eyebrow">${CFGN[state.cfg]} · ${STEPN[st]}</div><h1>${t}</h1>`;
  if(st===1) return top('Built around a 219″ wall of light.')+`<p class="cap">You come in at the rear left, onto the +600 level of the back row. Row 1 sits on the floor, and the side aisles step down beside it in four 150 mm steps.</p>
   <div class="tiles">${tile('10','Recliners (5 + 5)')}${tile(rear.toFixed(2)+'<small>m</small>','Row 2 to the rear wall',rear>=1?'ok':'bad')}</div>
   <div class="list">${row('Finished room','5.86 × ≈8.0 m')}${row('Height','3.73 m front · 3.13 m over riser')}${row('Levels','Row 1 floor · row 2 +600')}${row('Shape','L-shaped (entry vestibule)')}</div>
   <p class="fine">Dimensions are scaled from the R3 drawings (08-07-2025). Finished width is from Section D (1,186 + 244 + 3,004 + 244 + 1,186). The length is approximate, so please confirm it on site.</p>`;
  if(st===2){ const c=Math.round(g.clr*1000);
    return top('Row 2 is at reference. Row 1 is close.')+`<p class="cap">Angles are measured from each seated head. Trinnov and SMPTE allow no seat wider than 61° and put the main seat near 44°. The R3 speaker-angle sheet measures from row 1; Trinnov uses the reference seat, which here is the centre of row 2.</p>
   <div class="tiles">${tile(g.ang1.toFixed(0)+'°','Row 1 field of view',g.ang1>62?'bad':'ok')}${tile(g.ang2.toFixed(0)+'°','Row 2 · main seat',Math.abs(g.ang2-44)<=5?'ok':'warn')}${tile(c+'<small>mm</small>','Sightline over row-1 eyes',c>=100?'ok':'warn')}${tile(Math.round(SB()*1000)+'<small>mm</small>','LED bottom height')}</div>
   <p class="fine">Row 1 is about ${(R1.v-SCRV).toFixed(1)} m from the screen. Trinnov's closest distance for a 4.8 m screen is ${(0.84*SW).toFixed(2)} m. The layout is kept as drawn, but the client should know this.</p>`; }
  if(st===3){ const s=speakers(),f=n=>s.find(x=>x.n===n),mw=medianWide();
    return top('The R3 layout, checked against Trinnov.')+`<p class="cap">B&W 800 D4 in a 9.x.6 layout. The LED doesn't let sound through, so L and R stand beside it and the HTM81 centre goes above and below it, which is Trinnov's flat-screen case. The two centres mirror each other about the screen: the upper one is inverted, so both tweeters sit right against the picture edge and the dialogue image centres on the screen. Every surround and all six ceiling speakers are angled at the main seat, Trinnov's 'point toward the MLP' method.</p>
   <div class="tiles">${tile(Math.round(f('R').az)+'°','Screen L and R · guide 22–30°',f('R').az<=30?'ok':'warn')}${tile(Math.round(f('Rw').az)+'°','Wides · median angle '+Math.round(mw)+'°',Math.abs(f('Rw').az-mw)<=5?'ok':'warn')}${tile(Math.round(f('Rs').az)+'°','Sides · between the rows','ok')}${tile(Math.round(f('Rrs').az)+'°','Rears · guide 135–150°',f('Rrs').az>=135&&f('Rrs').az<=150?'ok':'warn')}</div>
   <div class="list">${row('Tops (front / mid / rear)',Math.round(f('Rtf').el)+'° · '+Math.round(f('Rtm').el)+'° · '+Math.round(f('Rtr').el)+'° up')}${row('Centre','HTM81 D4 pair · upper inverted')}${row('Subwoofers',state.cfg==='r3'?'4 × DB1D, corners':subs().length+' × MAG DBA15')}${row('Processor','Trinnov Altitude32')}</div>
   <p class="fine">The tops sit in the ceiling void about 200 mm above the false ceiling, aimed through it. The front pair lands at about ${Math.round(f('Rtf').el)}°, a little under the usual 35–45°, and Trinnov's 3D Remapping corrects for that.</p>`; }
  if(st===4){ const wf=state.cfg!=='r3', n=subs().length;
    return top(wf?'Bass that leaves the room once.':'Four corners, four sets of reflections.')+`<p class="cap">${state.cfg==='wf44'?'The ideal layout. Two DBA15s below the LED and two in the ceiling void above it, firing down, launch one flat wavefront from floor to ceiling. Four on the rear wall absorb it. The floor and ceiling rows together cancel the first height mode (46 Hz), which is what row 2 was left with.':wf?'The two front DBA15s below the LED send out one flat wavefront. The rear DBA15s absorb it, so it doesn\'t bounce back and build room modes.':'Corner subwoofers radiate in all directions. Every wall reflects the sound back, and the reflections overlap into room modes. Trinnov says the physics prevents a controlled wavefront from corners.'}</p>
   <div class="pill" id="bassSeg"><button data-cfg="r3">R3 corners</button><button data-cfg="wf22">2 + 2</button><button data-cfg="wf24">2 + 4</button><button data-cfg="wf44">Ideal 4 + 4</button></div>
   <div class="tiles">${tile('±'+Math.max(...g.bst.dev).toFixed(1)+'<small>dB</small>','Worst seat vs room average, 30–100 Hz',Math.max(...g.bst.dev)<=3?'ok':(Math.max(...g.bst.dev)<=6?'warn':'bad'))}${tile(g.bst.ok+'<small>/10</small>','Seats within ±3 dB',g.bst.ok===10?'ok':(g.bst.ok>=5?'warn':'bad'))}${tile(g.bst.worst.toFixed(0)+'<small>dB</small>','Largest seat-to-seat gap at any frequency')}${tile(n,wf?'MAG Theatron DBA15':'B&W DB1D')}</div>
   ${curveSVG(g.bst)}
   <p class="cap" style="margin-top:12px">${Math.max(...g.bst.dev)<=3?'Every seat hears the same bass.':(Math.max(...g.bst.dev)<=6?'Close. Most of what is left is a few dB between the two rows around 60–80 Hz, not seat to seat.':'Bass changes a lot from seat to seat, and row 2 gets it worst.')}</p>
   <div class="list">${row('Room modes','Width 29 · 59 · 88 Hz, height 46 · 92 Hz')}${row('Front emitters',wf?(state.cfg==='wf44'?'2 below the LED + 2 in the ceiling void':'2 below the LED, ¼ and ¾ across'):'—')}${row('Rear absorbers',wf?(state.cfg==='wf22'?'2, upper row':'4, planar 2 × 2'):'—')}</div>
   ${wf?`<details><summary>Subwoofer positions</summary><table><tr><th>Sub</th><th>From left wall</th><th>Centre height</th></tr>${subs().map(s=>`<tr><td>${s.n} ${s.front?'front':'rear'}</td><td>${f0(s.u*1000)} mm</td><td>${s.ceil?'Ceiling void, firing down':(s.front?f0(s.y*1000)+' mm':f0((s.y-RIS)*1000)+' mm over riser')}</td></tr>`).join('')}</table></details>`:''}
   <p class="fine">Room model, not a measurement: modes of the main room from 30 to 100 Hz. With WaveForming, each sub's level and timing is optimised per frequency toward a front-to-back plane wave, tuned on 40 points around the heads and scored at the 10 seats. The four R3 corner subs run on one feed. ${wf?'Trinnov recommends cutting rear subs before front ones, so 2 + 2 is a valid start. Trinnov\'s textbook 6 + 4 planar array scores about ±1.1 dB in the same model, but four of its front positions fall behind the LED, so the 4 + 4 layout is the ideal one for this room. ':''}Trinnov's on-site measurement is the final word.</p>`; }
  if(st===5){ const sb=SB();
    return top('A 219″ LED, as drawn.')+`<p class="cap">The LED stays at 630 mm. The front DBA15s tuck 60 mm behind its bottom edge, but their drivers end about 85 mm below the LED, so the sound path is open. The upper centre still fits under the false ceiling.</p>
   <div class="tiles">${tile('630<small>mm</small>','LED bottom')}${tile(f0(3733-(sb*1000+2700))+'<small>mm</small>','LED top to false ceiling · HTM81 is 334')}${tile(Gm.vert2.toFixed(0)+'°','Row 2 vertical · Trinnov reference 25°','ok')}${tile(Gm.vert1.toFixed(0)+'°','Row 1 vertical · UHD limit 34°',Gm.vert1>34?'bad':'ok')}</div>
   <div class="list">${row('Size','4,800 × 2,700 · 16:9')}${row('Row 1 look-up to top',Gm.up1.toFixed(0)+'°')}${row('Driver to LED edge','≈85 mm clear')}${row('Subs near the LED','WMT-15 anti-vibration, LED not resting on subs')}</div>`; }
  return top('What changes on the drawing.')+`<p class="cap">Revisions to R3 so that MAG Theatron DBA15s can run WaveForming. The speaker layout and the LED height don't change.</p>
   <ol class="rev"><li>Remove the 4 × B&amp;W DB1D <span>(front and rear corners).</span></li>
   <li>Add 2 × DBA15 on the front wall below the LED, on their side. <span>Centres 1,466 mm from each side wall and 2,932 mm apart, recessed in the 450 mm build-out with faces flush, 20 mm off the floor. The top 60 mm sits behind the LED edge; the driver stays ≈85 mm clear.</span></li>
   <li>Support the LED frame from the wall, not from the subs. <span>Keep a gap so sub vibration can't reach the LED modules.</span></li>
   <li>Add 2 × DBA15 upright on the rear wall. <span>Centres 1,466 mm from each side, 2,350 mm above the +600 riser, recessed in the build-out.</span></li>
   <li>Run a speaker cable to each sub on its own amp channel, from a Trinnov Altitude32.</li>
   <li>Phase 2, optional: add 2 more rear DBA15s 783 mm above the riser. <span>This needs the rear 805 D4s moved from 1,186 to 718 mm from the side walls.</span></li>
   <li>Ideal WaveForming (4 + 4): phase 2, plus 2 DBA15s in the ceiling void above the LED. <span>Lying flat and firing down through a grille in the false ceiling, 1,466 mm from each side wall, hung from the RCC slab on anti-vibration mounts. Clear of the upper HTM81.</span></li></ol>
   <p class="fine">Check the driver position on MAG's DBA15 drawing (assumed centred), that the sub can lie on its side, and the WMT-15 bracket depth against the 450 mm build-out (the sub is 330 mm deep).</p>`; }

function applyStep(moveCam=true){ const st=state.step; document.getElementById('cardBody').innerHTML=cardHTML();
  document.querySelectorAll('#dock button,#dots button').forEach(b=>b.classList.toggle('on',+b.dataset.step===st));
  G.dim.visible=st===1; G.ang.visible=st===2; G.spk.visible=st===3; G.bass.visible=st===4; G.led.visible=st===5;
  const see=st===3||st===4; G.screen.material.opacity=see?.15:1;
  G.front.traverse(o=>{ if(o.isMesh) o.material=see?M.wallG:M.wall; });
  const sh=document.getElementById('sheet'); sh.classList.toggle('on',st===6); stage.style.visibility=st===6?'hidden':''; if(st===6) renderSheet();
  const bs=document.getElementById('bassSeg'); if(bs){ bs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.cfg===state.cfg)); bs.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; state.cfg=b.dataset.cfg; build(); place(); }; }
  if(moveCam) setView(st===2?'top':(st===5?'section':'iso'),st); else place(); }

/* ---------- camera ---------- */
let orb={theta:0,phi:.6,r:10,target:new THREE.Vector3(W/2,1.2,L/2)};
function setView(v,st){ state.view=v; document.querySelectorAll('#views [data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  if(v==='seat'){ camera=persp; place(); return; } camera=ortho;
  if(v==='iso'){ const b={1:[.62,11,-.9],3:[.7,10.4,-.75],4:[.5,10.6,-.55],6:[.62,11,-.9]}[st||state.step]||[.62,11,-.9]; orb.theta=Math.atan2(1,-b[2]); orb.phi=b[0]; orb.r=b[1]; orb.target.set(W/2-.3,1.1,L/2-.4); }
  if(v==='top'){ orb.theta=0; orb.phi=1.5699; orb.r=10.2; orb.target.set(W/2-.4,0,L/2-.6); }
  if(v==='section'){ orb.theta=Math.PI/2; orb.phi=0; orb.r=7.6; orb.target.set(W/2,1.8,L/2-.35); }
  place(); }
function place(){ if(state.view==='seat'){ const m=Gm.mlp; persp.position.copy(P(m.u,m.y+.05,m.v)); persp.lookAt(P(Gm.cx,SB()+SH*.45,SCRV)); persp.updateProjectionMatrix(); cut(); return; }
  const {theta,phi,r,target}=orb; ortho.position.set(target.x+r*Math.cos(phi)*Math.sin(theta),target.y+r*Math.sin(phi),target.z+r*Math.cos(phi)*Math.cos(theta));
  ortho.up.set(0,1,0); if(phi>1.55) ortho.up.set(-Math.sin(theta),0,-Math.cos(theta)); ortho.lookAt(target);
  const w=stage.clientWidth,h=Math.max(1,stage.clientHeight),a=w/h,phone=w<760; let hh=r*.5; if(a<1) hh=r*.5/a*.9;
  const cardEl=document.getElementById('card'), min=cardEl.classList.contains('min'); let fx=0,fy=0;
  if(phone){ const covered=(min?120:Math.min(h*.42,cardEl.offsetHeight||h*.4))+64, top=90; fy=-((covered-top)/2)/h*2*hh; }
  else if(w>1000){ const cw=(cardEl.offsetWidth||360)+28; fx=-(cw/2)/w*2*hh*a; }
  ortho.left=fx-hh*a; ortho.right=fx+hh*a; ortho.top=fy+hh; ortho.bottom=fy-hh; ortho.updateProjectionMatrix(); cut(); }
function cut(){ const d=camera.position.clone().sub(new THREE.Vector3(W/2,1.5,L/2)); walls.forEach(w=>{ const hide=w.userData.n.dot(d)>.5; if(w===G.front&&(state.step===3||state.step===4)&&!hide) return; w.traverse(o=>{ if(o.isMesh) o.material=hide?M.ghost:M.wall; if(o.isLineSegments) o.visible=!hide; }); }); }
let drag=null; const cv=renderer.domElement; const ptrs=new Set();
cv.addEventListener('pointerdown',e=>{ ptrs.add(e.pointerId); if(ptrs.size>1){ drag=null; return; } if(state.view==='seat'){ state.view='iso'; camera=ortho; document.querySelectorAll('#views [data-view]').forEach(b=>b.classList.remove('on')); } drag={x:e.clientX,y:e.clientY,t:orb.theta,p:orb.phi}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove',e=>{ if(!drag||ptrs.size>1) return; orb.theta=drag.t-(e.clientX-drag.x)*.008; orb.phi=Math.max(0,Math.min(1.5699,drag.p+(e.clientY-drag.y)*.006)); place(); });
['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,e=>{ ptrs.delete(e.pointerId); drag=null; }));
cv.addEventListener('wheel',e=>{ e.preventDefault(); orb.r=Math.max(3,Math.min(22,orb.r*(1+Math.sign(e.deltaY)*.08))); place(); },{passive:false});
let pinch=null;
cv.addEventListener('touchstart',e=>{ if(e.touches.length===2){ pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); drag=null; } },{passive:true});
cv.addEventListener('touchmove',e=>{ if(e.touches.length===2&&pinch){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); orb.r=Math.max(3,Math.min(22,orb.r*pinch/d)); pinch=d; place(); } },{passive:true});

const GS={base:[1,2,3,4,5,6],e:[1],ang:[2],spk:[3],bass:[4],led:[5]},v3=new THREE.Vector3();
function labelsTick(){ const w=stage.clientWidth,h=stage.clientHeight; labels.forEach(l=>{ if(state.step===6||!(GS[l.grp]||[]).includes(state.step)){ l.el.style.display='none'; return; }
  v3.copy(l.pos).project(camera); if(v3.z>1||v3.z<-1||Math.abs(v3.x)>1.05||Math.abs(v3.y)>1.05){ l.el.style.display='none'; return; }
  l.el.style.display='block'; l.el.style.left=((v3.x+1)/2*w)+'px'; l.el.style.top=((1-v3.y)/2*h)+'px'; }); }
function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); persp.aspect=w/Math.max(1,h); persp.fov=w<h?78:58; persp.updateProjectionMatrix(); place(); }
window.addEventListener('resize',resize);
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; let last=performance.now();
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(state.step===4) tickWaves(reduce?dt*.4:dt); renderer.render(scene,camera); labelsTick(); requestAnimationFrame(loop); }

document.getElementById('optSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; state.cfg=b.dataset.cfg==='r3'?'r3':(state.cfg==='r3'?'wf22':state.cfg); build(); setView(state.view==='seat'?'iso':state.view); });
['dock','dots'].forEach(id=>document.getElementById(id).addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; state.step=+b.dataset.step; applyStep(true); }));
document.getElementById('grab').onclick=()=>{ document.getElementById('card').classList.toggle('min'); place(); };
const go=d=>{ state.step=Math.max(1,Math.min(6,state.step+d)); applyStep(true); };
document.getElementById('prev').onclick=()=>go(-1); document.getElementById('next').onclick=()=>go(1);
document.getElementById('views').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b&&b.dataset.view) setView(b.dataset.view); });
document.getElementById('savePng').addEventListener('click',()=>{ const a=document.createElement('a');
  if(state.step===6){ const svg=document.querySelector('#shBody svg'); a.download='SanjayLalBhai_'+state.sh+'_elevation.svg'; a.href='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.outerHTML.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg" style="background:#1d1d1f"')); a.click(); return; }
  a.download='SanjayLalBhai_'+state.cfg+'_Step'+state.step+'.png'; a.href=renderer.domElement.toDataURL('image/png'); a.click(); });
window.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') go(1); if(e.key==='ArrowLeft') go(-1); });
if(window.innerWidth<760) document.getElementById('card').classList.add('min');
document.getElementById('cardBody').addEventListener('click',e=>{ if(window.innerWidth<760&&e.target.closest('h1,.eyebrow')){ document.getElementById('card').classList.toggle('min'); place(); } });
build(); resize(); setView('iso',1); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
